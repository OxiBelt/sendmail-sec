name: Check

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"

jobs:
  devops:
    name: DevOps checks
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Enable pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: DevOps lint
        run: pnpm run lint

      - name: DevOps typecheck
        run: pnpm run typecheck

      - name: DevOps tests
        run: pnpm run test

      - name: Versioning check
        run: pnpm run versioning:check

  unit-tests:
    name: Unit tests (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-26.04
          - ubuntu-26.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Cargo
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Cargo fmt
        run: cargo fmt --all --check

      - name: Cargo clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Cargo test
        run: cargo test --locked

  docker-image:
    name: Docker image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-26.04
            image_tar: sendmail-sec-alpine-musl-amd64.tar
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-26.04-arm
            image_tar: sendmail-sec-alpine-musl-arm64.tar
          - arch: riscv64
            platform: linux/riscv64
            runner: ubuntu-26.04
            image_tar: sendmail-sec-alpine-musl-riscv64.tar

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pre-pull Docker BuildKit image
        run: scripts/retry-docker-pull.sh moby/buildkit:v0.31.2@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.31.2@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

      - name: Build Docker image artifact
        run: |
          scripts/build-docker-image-artifact.sh \
            "${{ matrix.platform }}" \
            "${{ matrix.arch }}" \
            "${RUNNER_TEMP}/sendmail-sec-image"

      - name: Load Docker image artifact
        run: docker load --input "${RUNNER_TEMP}/sendmail-sec-image/${{ matrix.image_tar }}"

      - name: Verify Docker image artifact
        run: scripts/verify-docker-image.sh "sendmail-sec:alpine-musl-${{ matrix.arch }}" "${{ matrix.arch }}"

      - name: Run Docker integration tests
        if: matrix.arch != 'riscv64'
        env:
          APP_IMAGE: sendmail-sec:alpine-musl-${{ matrix.arch }}
        run: |
          set -Eeuo pipefail
          trap 'docker image rm -f "${APP_IMAGE}" >/dev/null 2>&1 || true' EXIT
          REMOTE_TLS_MODE=wrapper scripts/docker-integration-test.sh
          REMOTE_TLS_MODE=starttls scripts/docker-integration-test.sh

      - name: Upload RISC-V Docker image artifact
        if: matrix.arch == 'riscv64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sendmail-sec-check-riscv64-image
          path: ${{ runner.temp }}/sendmail-sec-image/${{ matrix.image_tar }}
          if-no-files-found: error
          retention-days: 1

      - name: Clean up Docker image
        if: always()
        run: docker image rm -f "sendmail-sec:alpine-musl-${{ matrix.arch }}" >/dev/null 2>&1 || true

  docker-riscv64-smoke:
    name: Docker image runtime smoke (riscv64)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs:
      - docker-image
    permissions:
      actions: read

    steps:
      - name: Download RISC-V Docker image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sendmail-sec-check-riscv64-image
          path: ${{ runner.temp }}/sendmail-sec-image

      - name: Set up RISC-V emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          cache-image: false
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: riscv64

      - name: Run RISC-V Docker smoke test
        env:
          IMAGE_TAG: sendmail-sec:alpine-musl-riscv64
          IMAGE_TAR: ${{ runner.temp }}/sendmail-sec-image/sendmail-sec-alpine-musl-riscv64.tar
        run: |
          set -Eeuo pipefail
          trap 'docker image rm -f "${IMAGE_TAG}" >/dev/null 2>&1 || true' EXIT
          docker load --input "${IMAGE_TAR}"
          docker run --rm \
            --platform linux/riscv64 \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            "${IMAGE_TAG}" \
            --help >/dev/null
