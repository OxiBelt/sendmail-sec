name: Check

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"

jobs:
  devops:
    name: DevOps checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: DevOps lint
        run: pnpm run lint

      - name: DevOps typecheck
        run: pnpm run typecheck

      - name: DevOps tests
        run: pnpm run test

      - name: Versioning check
        run: pnpm run versioning:check

  unit-tests:
    name: Unit tests (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Cargo
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Cargo fmt
        run: cargo fmt --all --check

      - name: Cargo clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Cargo test
        run: cargo test --locked

  docker-image:
    name: Docker image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
            qemu_platforms: ""
            image_tar: sendmail-sec-alpine-musl-amd64.tar
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            qemu_platforms: ""
            image_tar: sendmail-sec-alpine-musl-arm64.tar
          - arch: riscv64
            platform: linux/riscv64
            runner: ubuntu-24.04
            qemu_platforms: riscv64
            image_tar: sendmail-sec-alpine-musl-riscv64.tar

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        if: matrix.qemu_platforms != ''
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: ${{ matrix.qemu_platforms }}

      - name: Pre-pull Docker BuildKit image
        run: scripts/retry-docker-pull.sh moby/buildkit:v0.31.2@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: image=moby/buildkit:v0.31.2@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

      - name: Build Docker image artifact
        run: |
          scripts/build-docker-image-artifact.sh \
            "${{ matrix.platform }}" \
            "${{ matrix.arch }}" \
            "${RUNNER_TEMP}/sendmail-sec-image"

      - name: Load Docker image artifact
        run: docker load --input "${RUNNER_TEMP}/sendmail-sec-image/${{ matrix.image_tar }}"

      # The riscv64 image is executed through QEMU on GitHub's amd64 runner.
      # Native amd64/arm64 jobs cover TLS relay behavior; riscv64 gets a
      # container startup smoke test below.
      - name: Run Docker integration tests
        if: matrix.arch != 'riscv64'
        env:
          APP_IMAGE: sendmail-sec:alpine-musl-${{ matrix.arch }}
        run: |
          set -Eeuo pipefail
          trap 'docker image rm -f "${APP_IMAGE}" >/dev/null 2>&1 || true' EXIT
          REMOTE_TLS_MODE=wrapper scripts/docker-integration-test.sh
          REMOTE_TLS_MODE=starttls scripts/docker-integration-test.sh

      - name: Run Docker smoke test
        if: matrix.arch == 'riscv64'
        env:
          IMAGE_TAG: sendmail-sec:alpine-musl-${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: docker run --rm --platform "${PLATFORM}" "${IMAGE_TAG}" --help >/dev/null
