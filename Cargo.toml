[package]
name = "sendmail-sec"
version = "0.1.1"
edition = "2024"
rust-version = "1.97"

[[bin]]
name = "sendmail-sec"
path = "sources/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
ipnet = { version = "2.12", features = ["serde"] }
libc = "0.2"
mailparse = "0.16"
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2"
sequoia-openpgp = { version = "2.4", default-features = false, features = ["allow-experimental-crypto", "allow-variable-time-crypto", "compression-deflate", "crypto-rust"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9.42"
sha1 = "0.11"
tokio = { version = "1.53", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
urlencoding = "2.1"
uuid = { version = "1.24", features = ["v4"] }
webpki-root-certs = "1.0"
webpki-roots = "1.0"
